<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Staff sign-in | The Sifted Cafe</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="admin">
  <noscript><p class="boot-message">This page needs JavaScript. Please turn it on in your browser.</p></noscript>

  <main class="login-view">
    <div class="login-card">
      <img src="/assets/logo-full.png" alt="The Sifted Cafe, cafe and bakery" width="900" height="564" class="login-logo">
      <h1>Staff sign-in</h1>
      <p class="login-sub">Reservation manager</p>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="login-username">Username</label>
          <input id="login-username" name="username" type="text" autocomplete="username" maxlength="50" required>
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <input id="login-password" name="password" type="password" autocomplete="current-password" maxlength="200" required>
        </div>
        <div id="login-status" class="login-status" role="alert"></div>
        <button id="login-submit" class="btn btn-primary btn-block" type="submit">Sign in</button>
      </form>
      <p class="login-back"><a href="/">Back to the website</a></p>
    </div>
  </main>

  <script src="/js/login.js" defer></script>
</body>
</html>
